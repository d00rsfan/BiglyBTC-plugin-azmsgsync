name: Message-sync envelopes offline compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        compiler: [gcc, asan]
    env:
      TMPDIR: /tmp
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Ubuntu compiler and dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-16=16-20260322-1ubuntu1 \
            g++-16=16-20260322-1ubuntu1 \
            libstdc++-16-dev=16-20260322-1ubuntu1 \
            cmake=4.2.3-2ubuntu2 \
            ninja-build=1.13.2-1 \
            python3 \
            libssl-dev=3.5.5-1ubuntu3.7 \
            libssl3t64=3.5.5-1ubuntu3.7
          /usr/bin/g++-16 --version
          /usr/bin/cmake --version
          dpkg-query -W > "$RUNNER_TEMP/biglybtc-packages.txt"
      - name: Compile and replay offline original observations
        shell: bash
        env:
          COMPILER_KIND: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          build_type=Release
          flags=
          if [[ "$COMPILER_KIND" == asan ]]; then
            build_type=Debug
            flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          fi
          /usr/bin/cmake -S . -B "$RUNNER_TEMP/biglybtc-msgsync-$COMPILER_KIND" -G Ninja -DCMAKE_BUILD_TYPE="$build_type" -DCMAKE_CXX_COMPILER=/usr/bin/g++-16 -DCMAKE_CXX_FLAGS="$flags"
          nice -n 5 /usr/bin/cmake --build "$RUNNER_TEMP/biglybtc-msgsync-$COMPILER_KIND" -j2
          /usr/bin/ctest --test-dir "$RUNNER_TEMP/biglybtc-msgsync-$COMPILER_KIND" --output-on-failure
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msgsync-ubuntu-26.04-${{ matrix.compiler }}
          path: |
            ${{ runner.temp }}/biglybtc-msgsync-${{ matrix.compiler }}/CMakeCache.txt
            ${{ runner.temp }}/biglybtc-msgsync-${{ matrix.compiler }}/Testing/Temporary
            ${{ runner.temp }}/biglybtc-packages.txt
          if-no-files-found: warn
          retention-days: 7
